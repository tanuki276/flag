:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;color:#f6f3ff;background:#080d19}*{box-sizing:border-box}html,body,#app{margin:0;width:100%;height:100%;overflow:hidden}#stage{position:absolute;inset:0}canvas{display:block;width:100%;height:100%}.hud{position:absolute;inset:0;pointer-events:none;display:flex;justify-content:space-between;align-items:flex-start;padding:clamp(16px,3vw,32px);z-index:2}.brand{text-shadow:0 3px 22px #0009}.eyebrow{font-size:11px;letter-spacing:.22em;opacity:.72}.brand h1{font:600 clamp(42px,7vw,88px)/.95 Georgia,serif;margin:10px 0}.brand p{font-size:13px;opacity:.72;max-width:340px}.panel{pointer-events:auto;width:min(290px,40vw);padding:16px 18px;border:1px solid #d3c7ff33;background:#090d1cb8;backdrop-filter:blur(14px)}.row{display:flex;justify-content:space-between;gap:12px;padding:5px 0;font-size:11px;letter-spacing:.1em}.row span{opacity:.55}.meter{height:4px;background:#ffffff1a;margin:12px 0}.meter span{display:block;width:82%;height:100%;background:linear-gradient(90deg,#7a64ff,#c1b7ff)}.hint{font-size:11px;line-height:1.5;opacity:.65}.controls{position:absolute;z-index:3;left:clamp(16px,3vw,32px);bottom:clamp(16px,3vw,32px);display:flex;gap:8px}button{pointer-events:auto;border:1px solid #e6deff38;background:#080c19b8;color:#f7f3ff;padding:10px 15px;font:inherit;font-size:12px;cursor:pointer}button:hover{background:#45375eb3}.credit{position:absolute;right:22px;bottom:24px;z-index:2;font-size:10px;letter-spacing:.14em;opacity:.45}@media(max-width:650px){.panel{position:absolute;right:16px;top:160px;width:180px;padding:12px}.brand p{max-width:210px}.credit{display:none}}

<body><div id="app"><div id="stage"></div><div class="hud"><div class="brand"><div class="eyebrow">ORIGINAL FANTASY CHARACTER</div><h1>Asteria</h1><p>Cel-shaded 3D prototype · Astral Duelist</p></div><section class="panel"><div class="row"><span>ELEMENT</span><b>✧ ASTRAL</b></div><div class="row"><span>CLASS</span><b>DUELIST</b></div><div class="meter"><span></span></div><div class="hint">ドラッグで回転 · ホイールでズーム<br>Space キーでバースト</div></section></div><div class="controls"><button id="pose">POSE</button><button id="burst">✧ BURST</button><button id="reset">RESET VIEW</button></div><div class="credit">THREE.JS · REALTIME CHARACTER STUDY</div></div>
<script type="module">
import * as THREE from 'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';
const stage=document.querySelector('#stage'),scene=new THREE.Scene();scene.background=new THREE.Color('#080d19');scene.fog=new THREE.Fog('#080d19',10,25);
const camera=new THREE.PerspectiveCamera(35,innerWidth/innerHeight,.1,100);camera.position.set(5.4,3.15,8.2);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;renderer.shadowMap.enabled=true;stage.appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,2.25,0);controls.enableDamping=true;controls.minDistance=5.4;controls.maxDistance=11.5;controls.maxPolarAngle=Math.PI*.82;controls.minPolarAngle=Math.PI*.27;
scene.add(new THREE.HemisphereLight('#fff3dd','#16233c',2.2));const key=new THREE.DirectionalLight('#fff5e8',4);key.position.set(5,8,6);key.castShadow=true;scene.add(key);const rim=new THREE.DirectionalLight('#8ab4ff',3);rim.position.set(-5,4,-4);scene.add(rim);const fill=new THREE.PointLight('#a77dff',5.5,9,2);fill.position.set(0,2.8,3.1);scene.add(fill);
const ground=new THREE.Mesh(new THREE.CircleGeometry(6.5,64),new THREE.MeshStandardMaterial({color:'#101826',roughness:.92}));ground.rotation.x=-Math.PI/2;ground.position.y=-.02;scene.add(ground);const ring=new THREE.Mesh(new THREE.RingGeometry(1.9,2.02,96),new THREE.MeshBasicMaterial({color:'#8f72ff',transparent:true,opacity:.35,side:THREE.DoubleSide}));ring.rotation.x=-Math.PI/2;scene.add(ring);
const C={skin:'#f4d6c2',hair:'#2f355f',hi:'#777be3',cloth:'#5848ae',dark:'#15182f',gold:'#e5c26d',white:'#f0f0fb',eye:'#a99cff',boots:'#24253e',glow:'#9d86ff'},grad=new THREE.DataTexture(new Uint8Array([35,95,160,220,255]),5,1,THREE.RedFormat);grad.needsUpdate=true;
const toon=c=>new THREE.MeshToonMaterial({color:c,gradientMap:grad}),root=new THREE.Group();scene.add(root);
function mesh(g,m,p=root){const o=new THREE.Mesh(g,m);o.castShadow=true;p.add(o);return o}function cap(r,d,c,pos,s=[1,1,1],p=root,rot=[0,0,0]){const o=mesh(new THREE.CapsuleGeometry(r,d,6,12),toon(c),p);o.position.set(...pos);o.scale.set(...s);o.rotation.set(...rot);return o}function sph(r,c,pos,s=[1,1,1],p=root){const o=mesh(new THREE.SphereGeometry(r,20,14),toon(c),p);o.position.set(...pos);o.scale.set(...s);return o}
cap(.28,1.35,C.dark,[-.27,.93,0],[.9,1,.9]);cap(.28,1.35,C.dark,[.27,.93,0],[.9,1,.9]);cap(.31,.55,C.boots,[-.3,.22,.09],[1.05,.72,1.2]);cap(.31,.55,C.boots,[.3,.22,.09],[1.05,.72,1.2]);mesh(new THREE.ConeGeometry(.9,.95,6),toon(C.cloth)).position.set(0,1.65,0);sph(.62,C.white,[0,2.28,0],[.95,1.15,.68]);cap(.18,.72,C.dark,[0,1.9,.43]);
const arms=[];for(const x of [-.63,.63]){const a=new THREE.Group();a.position.set(x,2.2,0);root.add(a);cap(.17,.82,C.white,[0,-.35,0],[1,1,1],a,[0,0,x<0?-.18:.18]);sph(.18,C.skin,[0,-.82,0],[1,1,1],a);arms.push(a);sph(.24,C.gold,[x,2.48,0])}
cap(.16,.3,C.skin,[0,2.97,0]);const head=new THREE.Group();head.position.set(0,3.55,0);root.add(head);sph(.66,C.skin,[0,0,0],[.89,1,.83],head);sph(.72,C.hair,[0,.2,-.04],[.98,.98,.9],head);
for(const[x,y,z,rz]of[[-.48,.04,.48,-.32],[-.23,-.03,.57,-.12],[0,-.02,.61,.02],[.24,-.02,.57,.12],[.48,.04,.48,.32]]){const p=mesh(new THREE.ConeGeometry(.23,.72,5),toon(C.hi),head);p.position.set(x,y,z);p.rotation.set(Math.PI*.48,0,rz)}
for(const x of[-.23,.23]){const e=mesh(new THREE.SphereGeometry(.11,16,10),new THREE.MeshBasicMaterial({color:C.eye}),head);e.position.set(x,-.02,.57);e.scale.set(1,1.35,.36);const b=mesh(new THREE.BoxGeometry(.2,.035,.035),toon(C.hair),head);b.position.set(x,.22,.56);b.rotation.z=x<0?.08:-.08}
for(const x of[-.28,.28]){const r=mesh(new THREE.BoxGeometry(.12,1.35,.06),toon(x<0?C.hi:C.cloth));r.position.set(x,1.75,-.48);r.rotation.z=x*.35}
const core=new THREE.Group();core.position.set(0,2.25,1.15);root.add(core);mesh(new THREE.IcosahedronGeometry(.25,1),new THREE.MeshStandardMaterial({color:'#c9c0ff',emissive:'#7a64ff',emissiveIntensity:3.2}),core);const halo=mesh(new THREE.TorusGeometry(.43,.028,8,64),new THREE.MeshBasicMaterial({color:C.glow,transparent:true,opacity:.8}),core);halo.rotation.x=Math.PI/2;
const weapon=new THREE.Group();weapon.position.set(.98,1.65,-.05);weapon.rotation.z=-.42;root.add(weapon);const blade=mesh(new THREE.BoxGeometry(.11,2.1,.035),new THREE.MeshBasicMaterial({color:'#d9e6ff'}),weapon);blade.position.y=.7;const guard=mesh(new THREE.BoxGeometry(.46,.09,.06),toon(C.gold),weapon);guard.position.y=-.28;const grip=mesh(new THREE.CylinderGeometry(.08,.08,.5,10),toon(C.dark),weapon);grip.position.y=-.55;const tip=mesh(new THREE.ConeGeometry(.11,.26,4),toon(C.gold),weapon);tip.position.y=1.83;
const n=90,pg=new THREE.BufferGeometry(),ps=new Float32Array(n*3);for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,r=1.8+Math.random()*2.6;ps[i*3]=Math.cos(a)*r;ps[i*3+1]=.25+Math.random()*4.5;ps[i*3+2]=Math.sin(a)*r}pg.setAttribute('position',new THREE.BufferAttribute(ps,3));const stars=new THREE.Points(pg,new THREE.PointsMaterial({color:'#bfb6ff',size:.055,transparent:true,opacity:.72}));scene.add(stars);
let pose=0,burst=0;function trigger(){burst=1;const f=new THREE.Mesh(new THREE.RingGeometry(.25,1.65,64),new THREE.MeshBasicMaterial({color:'#b6a8ff',transparent:true,opacity:.9,side:THREE.DoubleSide}));f.rotation.x=-Math.PI/2;f.position.y=.05;scene.add(f);const start=performance.now();function tick(now){const t=Math.min((now-start)/700,1);f.scale.setScalar(.35+t*1.8);f.material.opacity=.9*(1-t);if(t<1)requestAnimationFrame(tick);else{scene.remove(f);f.geometry.dispose();f.material.dispose()}}requestAnimationFrame(tick)}
document.querySelector('#pose').onclick=()=>pose=pose?0:1;document.querySelector('#burst').onclick=trigger;document.querySelector('#reset').onclick=()=>{controls.target.set(0,2.25,0);camera.position.set(5.4,3.15,8.2);controls.update();pose=0};addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();trigger()}});
const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);const t=clock.getElapsedTime();root.position.y=.02+Math.sin(t*1.65)*.045;head.rotation.y=Math.sin(t*.6)*.06;arms[0].rotation.z=-.08+pose*.48+Math.sin(t*1.2)*.02;arms[1].rotation.z=.08-pose*.3-Math.sin(t*1.2)*.02;core.rotation.y=t*1.8;core.rotation.z=Math.sin(t*1.2)*.25;core.scale.setScalar(1+Math.sin(t*3.6)*.05+burst*.15);ring.rotation.z=t*.12;stars.rotation.y=t*.035;burst*=.92;controls.update();renderer.render(scene,camera)}animate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
